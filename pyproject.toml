[project]
name = "trading-bot"
version = "0.1.0"
description = "Bot de trading algorítmico con ML (paper → live) sobre cripto"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# Depends() en defaults es el idioma estándar de FastAPI (no es un mutable-default real).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
filterwarnings = [
    # Deprecación interna de alpaca-py (importa websockets.legacy). No es código nuestro.
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:websockets.legacy",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
